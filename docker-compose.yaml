  postgres:
    image: postgres:latest
    container_name: bupapi-postgres
    ports:
      - 5432:5432
    networks:
      - bupapi
    volumes:
      - bupapi_pgData:/var/lib/postgresql/MAJOR/docker
    environment:
      - POSTGRES_PASSWORD=postgres
  redis:
    image: redis:latest
    container_name: bupapi-redis-server
    ports:
      - 6379:6379
    networks:
      - bupapi
    volumes:
      - bupapi_redis:/data
  redis_insight:
    depends_on:
      - "redis"
    image: redis/redisinsight:latest
    container_name: bupapi-redisinsight
    volumes:
      - bupapi_redisinsight:/data
    ports:
      - 5540:5540
    networks:
      - bupapi
    environment:
      - RI_REDIS_HOST_0=bupapi-redis-server
      - RI_REDIS_PORT_0=6379
      - RI_REDIS_USERNAME_0=default
      - RI_REDIS_PASSWORD_0=default
